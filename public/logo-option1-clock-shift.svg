<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="#1e40af" stroke="#1e3a8a" stroke-width="3"/>
  
  <!-- THEOSHIFT Text in Arch at Top -->
  <defs>
    <path id="archPath" d="M 25,100 A 75,75 0 0,1 175,100" />
  </defs>
  <text font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" letter-spacing="3">
    <textPath href="#archPath" startOffset="50%" text-anchor="middle">
      THEOSHIFT
    </textPath>
  </text>
  
  <!-- Clock face with shift rotation -->
  <circle cx="100" cy="100" r="45" fill="none" stroke="#fcd34d" stroke-width="3"/>
  
  <!-- Clock hour markers (simplified - 12, 3, 6, 9) -->
  <circle cx="100" cy="60" r="3" fill="#fcd34d"/>
  <circle cx="140" cy="100" r="3" fill="#fcd34d"/>
  <circle cx="100" cy="140" r="3" fill="#fcd34d"/>
  <circle cx="60" cy="100" r="3" fill="#fcd34d"/>
  
  <!-- Clock hands pointing to shift time -->
  <line x1="100" y1="100" x2="100" y2="75" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <line x1="100" y1="100" x2="120" y2="100" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Circular rotation arrows around clock -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" fill="#f59e0b">
      <polygon points="0 0, 10 3, 0 6" />
    </marker>
  </defs>
  
  <path d="M 100,50 A 50,50 0 0,1 145,80" 
        stroke="#f59e0b" 
        stroke-width="3" 
        fill="none" 
        marker-end="url(#arrowhead)"
        stroke-linecap="round"
        opacity="0.8"/>
  
  <path d="M 145,120 A 50,50 0 0,1 100,150" 
        stroke="#f59e0b" 
        stroke-width="3" 
        fill="none" 
        marker-end="url(#arrowhead)"
        stroke-linecap="round"
        opacity="0.8"/>
  
  <path d="M 55,120 A 50,50 0 0,1 55,80" 
        stroke="#f59e0b" 
        stroke-width="3" 
        fill="none" 
        marker-end="url(#arrowhead)"
        stroke-linecap="round"
        opacity="0.8"/>
  
  <!-- Center hub -->
  <circle cx="100" cy="100" r="5" fill="#f59e0b"/>
  
  <!-- Subtitle in curved arc at bottom -->
  <defs>
    <path id="bottomArchPath" d="M 30,115 A 70,70 0 0,0 170,115" />
  </defs>
  <text font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#93c5fd" letter-spacing="1">
    <textPath href="#bottomArchPath" startOffset="50%" text-anchor="middle">
      Volunteer Coordination
    </textPath>
  </text>
</svg>
