<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="32" cy="32" r="30" fill="#1e40af" stroke="#1e3a8a" stroke-width="2"/>
  
  <!-- Clock face -->
  <circle cx="32" cy="32" r="18" fill="none" stroke="#fcd34d" stroke-width="2"/>
  
  <!-- Clock hour markers (12, 3, 6, 9) -->
  <circle cx="32" cy="16" r="2" fill="#fcd34d"/>
  <circle cx="48" cy="32" r="2" fill="#fcd34d"/>
  <circle cx="32" cy="48" r="2" fill="#fcd34d"/>
  <circle cx="16" cy="32" r="2" fill="#fcd34d"/>
  
  <!-- Clock hands -->
  <line x1="32" y1="32" x2="32" y2="22" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="32" x2="40" y2="32" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Rotation arrows -->
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" fill="#f59e0b">
      <polygon points="0 0, 6 3, 0 6" />
    </marker>
  </defs>
  
  <path d="M 32,12 A 20,20 0 0,1 48,24" 
        stroke="#f59e0b" 
        stroke-width="2" 
        fill="none" 
        marker-end="url(#arrow)"
        opacity="0.8"/>
  
  <path d="M 48,40 A 20,20 0 0,1 32,52" 
        stroke="#f59e0b" 
        stroke-width="2" 
        fill="none" 
        marker-end="url(#arrow)"
        opacity="0.8"/>
  
  <path d="M 16,40 A 20,20 0 0,1 16,24" 
        stroke="#f59e0b" 
        stroke-width="2" 
        fill="none" 
        marker-end="url(#arrow)"
        opacity="0.8"/>
  
  <!-- Center hub -->
  <circle cx="32" cy="32" r="2.5" fill="#f59e0b"/>
</svg>
